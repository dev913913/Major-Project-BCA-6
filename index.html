<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codev by Dev Kumar</title>
    <link rel="icon" type="image/svg+xml" href="/brand-logo.svg" />
    <link rel="apple-touch-icon" href="/brand-logo.svg" />
    <script>
      (() => {
        const storageKey = 'codev-theme';
        try {
          const storedTheme = localStorage.getItem(storageKey);
          const theme = storedTheme === 'light' || storedTheme === 'dark'
            ? storedTheme
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch {
          const theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        }
      })();
    </script>
    <meta name="description" content="Learn programming with interactive lessons and hands-on practice on Codev, created by Dev Kumar." />
    <meta name="author" content="Dev Kumar" />
    <meta property="og:title" content="Codev by Dev Kumar" />
    <meta property="og:description" content="Master coding through interactive lessons and hands-on practice." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Codev",
        "author": {
          "@type": "Person",
          "name": "Dev Kumar",
          "url": "https://dev-portfolio-3000.vercel.app/"
        },
        "description": "Modern platform for learning programming through practical lessons."
      }
    </script>
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
